name: Promote Production Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Production Docker tag, for example 1.0.0"
        required: true
        type: string
      promote_scraper:
        description: "Also promote the scraper image"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  WEB_IMAGE_NAME: novn01/recon.id
  SCRAPER_IMAGE_NAME: novn01/recon-scraper
  STAGGING_TAG: stagging

jobs:
  promote-production:
    name: Promote stagging image to production version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION (expected X.Y.Z, for example 1.0.0)"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote web image manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$WEB_IMAGE_NAME:$VERSION" \
            "$WEB_IMAGE_NAME:$STAGGING_TAG"
          docker buildx imagetools inspect "$WEB_IMAGE_NAME:$VERSION"

      - name: Promote scraper image
        if: inputs.promote_scraper
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$SCRAPER_IMAGE_NAME:$VERSION" \
            "$SCRAPER_IMAGE_NAME:$STAGGING_TAG"
          docker buildx imagetools inspect "$SCRAPER_IMAGE_NAME:$VERSION"
